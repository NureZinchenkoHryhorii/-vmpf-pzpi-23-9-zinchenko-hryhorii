<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Прогноз погоди</title>
</head>
<body>

    <h1>Поточна погода</h1>

    <p id="temperature">Завантаження...</p>
    <p id="description"></p>

    <script>
        fetch("https://api.open-meteo.com/v1/forecast?latitude=50.45&longitude=30.52&current_weather=true")
            .then(response => response.json())
            .then(data => {
                document.getElementById("temperature").textContent =
                    "Температура: " + data.current_weather.temperature + "°C";

                document.getElementById("description").textContent =
                    "Швидкість вітру: " + data.current_weather.windspeed + " км/год";
            })
            .catch(error => {
                console.log(error);
            });
    </script>

</body>
</html>
