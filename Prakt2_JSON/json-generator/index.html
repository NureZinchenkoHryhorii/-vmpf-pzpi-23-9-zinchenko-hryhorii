<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Генератор JSON</title>
</head>
<body>

<h1>Генератор JSON</h1>

<input type="text" id="name" placeholder="Ім'я">
<br><br>

<input type="number" id="age" placeholder="Вік">
<br><br>

<button onclick="generateJSON()">Створити JSON</button>

<pre id="result"></pre>

<script>
function generateJSON() {

    const person = {
        name: document.getElementById("name").value,
        age: Number(document.getElementById("age").value)
    };

    const jsonData = JSON.stringify(person, null, 4);

    document.getElementById("result").textContent = jsonData;
}
</script>

</body>
</html>
